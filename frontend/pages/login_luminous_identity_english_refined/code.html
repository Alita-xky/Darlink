<script>
    // --- Shader Background (ANIMATION_46) ---
    (function() {
      const canvas = document.getElementById('shader-canvas-ANIMATION_46');

      function syncSize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w * window.devicePixelRatio;
        canvas.height = h * window.devicePixelRatio;
        const gl = canvas.getContext('webgl');
        if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
      }
      window.addEventListener('resize', syncSize);
      syncSize();

      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;

      const vs = `attribute vec2 a_position;
      varying vec2 v_texCoord;
      void main() {
        v_texCoord = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }`;

      const fs = `precision highp float;
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;
      varying vec2 v_texCoord;

      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

      float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1;
          i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m ;
          m = m*m ;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 a0 = x - floor(x + 0.5);
          vec3 g = rsqrt(x*x + h*h);
          vec3 ox = floor(a0 + 0.5);
          vec3 zh = 1.0 - 0.5*abs(ox) - 0.5*abs(a0);
          vec3 grx = ox * g.x + zh * g.y;
          vec3 gry = a0 * g.x + zh * g.z;
          vec3 res = 130.0 * m * (x*gry + h*zh);
          return res.x;
      }

      void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          vec2 m = u_mouse / u_resolution;
          
          float noise = snoise(uv * 3.0 + u_time * 0.1 + m * 0.2);
          noise += 0.5 * snoise(uv * 6.0 - u_time * 0.15);
          
          vec3 color1 = vec3(0.98, 0.98, 1.0); 
          vec3 color2 = vec3(1.0, 0.90, 0.98); 
          vec3 color3 = vec3(0.92, 0.95, 1.0); 
          vec3 color4 = vec3(0.95, 0.92, 1.0); 
          
          vec3 color = mix(color1, color2, smoothstep(-1.0, 1.0, noise));
          color = mix(color, color3, smoothstep(0.0, 1.0, snoise(uv * 2.0 + u_time * 0.05)));
          color = mix(color, color4, smoothstep(0.2, 0.8, noise));
          
          float dist = distance(uv, m);
          color += vec3(0.05, 0.02, 0.08) * (1.0 - smoothstep(0.0, 0.6, dist));
          
          gl_FragColor = vec4(color, 1.0);
      }`;

      function cs(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'a_position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      const uMouse = gl.getUniformLocation(prog, 'u_mouse');

      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = window.innerHeight - e.clientY;
      });

      function render(t) {
        gl.uniform1f(uTime, t * 0.001);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform2f(uMouse, mouse.x * window.devicePixelRatio, mouse.y * window.devicePixelRatio);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();

    // --- 3D Heart Particles (ANIMATION_50) ---
    (function() {
      const container = document.getElementById('threejs-container-ANIMATION_50');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
      camera.position.z = 5;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      function createHeartShape() {
        const shape = new THREE.Shape();
        const x = 0, y = 0;
        shape.moveTo( x + 0.5, y + 0.5 );
        shape.bezierCurveTo( x + 0.5, y + 0.5, x + 0.4, y, x, y );
        shape.bezierCurveTo( x - 0.6, y, x - 0.6, y + 0.7, x - 0.6, y + 0.7 );
        shape.bezierCurveTo( x - 0.6, y + 1.1, x - 0.3, y + 1.54, x + 0.5, y + 1.9 );
        shape.bezierCurveTo( x + 1.2, y + 1.54, x + 1.6, y + 1.1, x + 1.6, y + 0.7 );
        shape.bezierCurveTo( x + 1.6, y + 0.7, x + 1.6, y, x + 1.0, y );
        shape.bezierCurveTo( x + 0.7, y, x + 0.5, y + 0.5, x + 0.5, y + 0.5 );
        return shape;
      }

      const heartShape = createHeartShape();
      const geometry = new THREE.ShapeGeometry(heartShape);
      geometry.center();

      const particlesCount = 300;
      const hearts = [];
      const material = new THREE.MeshBasicMaterial({
        color: 0xff4f91,
        transparent: true,
        opacity: 0.6,
        side: THREE.DoubleSide
      });

      for (let i = 0; i < particlesCount; i++) {
        const heart = new THREE.Mesh(geometry, material.clone());
        heart.position.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 10);
        heart.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        const s = Math.random() * 0.1 + 0.05;
        heart.scale.set(s, s, s);
        heart.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01);
        heart.userData.rotVelocity = new THREE.Vector3(Math.random() * 0.02, Math.random() * 0.02, Math.random() * 0.02);
        scene.add(heart);
        hearts.push(heart);
      }

      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
      });

      function animate() {
        requestAnimationFrame(animate);
        hearts.forEach(heart => {
          heart.position.add(heart.userData.velocity);
          heart.rotation.x += heart.userData.rotVelocity.x;
          heart.rotation.y += heart.userData.rotVelocity.y;
          if (Math.abs(heart.position.x) > 8) heart.position.x *= -0.98;
          if (Math.abs(heart.position.y) > 8) heart.position.y *= -0.98;
          if (Math.abs(heart.position.z) > 8) heart.position.z *= -0.98;
          const dx = mouseX * 5 - heart.position.x;
          const dy = mouseY * 5 - heart.position.y;
          heart.position.x += dx * 0.001;
          heart.position.y += dy * 0.001;
        });
        scene.rotation.y += 0.001;
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });

      animate();
    })();
    </script>
