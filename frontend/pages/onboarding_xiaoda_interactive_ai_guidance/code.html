<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Onboarding - Xiaoda Digital Human Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#111c2d",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary": "#8a486f",
                        "primary": "#6f5092",
                        "on-secondary-fixed-variant": "#004d66",
                        "outline": "#7c7480",
                        "on-tertiary-fixed-variant": "#6f3157",
                        "on-error-container": "#93000a",
                        "on-surface": "#111c2d",
                        "surface-variant": "#d8e3fb",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#e7eeff",
                        "inverse-surface": "#263143",
                        "on-primary-fixed-variant": "#573878",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-fixed": "#29074a",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d8e3fb",
                        "background": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#fcaad6",
                        "on-primary-container": "#604283",
                        "surface-bright": "#f9f9ff",
                        "on-secondary-container": "#005b78",
                        "surface-tint": "#6f5092",
                        "tertiary-fixed-dim": "#ffaeda",
                        "error": "#ba1a1a",
                        "inverse-primary": "#dbb8ff",
                        "primary-fixed": "#efdbff",
                        "outline-variant": "#cdc3d0",

                        "inverse-on-surface": "#ecf1ff",
                        "secondary-container": "#7ed4fd",
                        "on-tertiary-fixed": "#3a0329",
                        "on-tertiary-container": "#793a60",
                        "primary-container": "#d8b4fe",
                        "surface": "#f9f9ff",

                    "borderRadius": {

                    "spacing": {
                        "element-gap": "12px",
                        "container-padding-mobile": "20px",
                        "gutter": "16px",
                        "container-padding-desktop": "40px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],

                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]

                    "fontSize": {

                    }
                }
            }
        }
    </script>
<style>
        .glass-edge {
            box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.4);
        }
        .anim-float {
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .glow-pulse {
            animation: glow 4s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .transition-stage {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-bubble-arrow::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 40px;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen w-full overflow-hidden relative">
<!-- Ambient Background Animation -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 blur-[120px] rounded-full"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full h-full flex flex-col items-center justify-between px-4 md:px-8 py-10 max-w-7xl mx-auto overflow-hidden">
<!-- Top Progress Indicator -->
<header class="w-full max-w-md flex flex-col items-center gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">person</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">步骤 1/3：基础身份</span>
</div>
<div class="w-full h-1.5 bg-surface-variant/50 backdrop-blur-sm rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-gradient-to-r from-primary via-tertiary to-secondary rounded-full shadow-[0_0_12px_rgba(216,180,254,0.8)] transition-all duration-1000 ease-out"></div>
</div>
</header>
<!-- Center Stage: Full Body Digital Human & Conversational Card -->
<div class="flex-1 w-full flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-16">
<!-- Full Body Digital Human Container -->
<div class="relative w-full max-w-[320px] md:max-w-[400px] lg:max-w-[450px] aspect-[3/4] flex items-center justify-center">
<!-- Ethereal Glow Behind -->
<div class="absolute inset-0 bg-primary-container/30 blur-[80px] rounded-full glow-pulse"></div>
<!-- Digital Human Image: Xiaoda -->
<div class="relative z-10 w-full h-full anim-float flex items-center justify-center">
<img alt="小搭 - 全身形象 3D 数字人" class="w-full h-full object-contain drop-shadow-[0_20px_50px_rgba(111,80,146,0.2)]" src="https://lh3.googleusercontent.com/aida/AP1WRLsnsIFJCJv7SFV38Vcha_VZKEgjsOCv-QQo_FxmmvS9gdC0EfKG9MgHbDWksZcYP7JxPcs8hRcuD3bQY4MNL6bZIJwtB5KmI6Ikm0oRzoImnIgrk234MgIrPkBjrfI0MR6JMOD1bfzYqQxTwaKuruXyaqlOV3Le7Uo0bBHUC7E6KIhKNm0ggAIipCFlOBfpnQFXWselIxoFfvVE_M0tF8SMdp_p_O1wIyN3B0kZdN5sKD8N-HIQjy-Y5mA">
</div>
</div>
<!-- Conversational Chat Interface -->
<div class="w-full max-w-lg lg:max-w-xl bg-white/40 dark:bg-white/5 backdrop-blur-3xl border border-white/40 shadow-[0_30px_100px_rgba(0,0,0,0.05)] rounded-[3rem] p-8 md:p-12 flex flex-col items-center lg:items-start relative glass-edge transition-stage">
<!-- Dialogue Area (Chat-like) -->
<div class="w-full mb-8 space-y-4">
<div class="bg-primary/10 rounded-2xl p-4 lg:p-6 self-start max-w-[90%]"><h1 class="font-headline-md text-headline-md text-left text-on-surface font-bold mb-1 bg-gradient-to-r from-primary via-tertiary to-secondary bg-clip-text text-transparent">
    开启你的 AI 旅程
</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-left">
    与小搭一起探索无限可能
</p></div>
</div>
<!-- Input Fields Section -->
<div class="w-full space-y-6">
<!-- Chat History Simulation -->
<div class="space-y-4 max-h-[200px] overflow-y-auto pr-2 custom-scrollbar">
<div class="flex flex-col gap-2">
<div class="bg-white/60 backdrop-blur-md border border-white/50 rounded-2xl rounded-tl-none p-4 text-on-surface-variant text-body-md shadow-sm">
                你好！我是小搭。很高兴能在这里遇见你。我们可以先从你的名字开始了解吗？
            </div>
<span class="text-[10px] text-on-surface-variant/40 px-2">10:24 AM</span>
</div>
</div>
<!-- Chat Input Area -->
<div class="relative group">
<div class="flex items-center gap-3 bg-white/60 backdrop-blur-md border border-white/50 rounded-2xl p-2 pl-6 focus-within:ring-2 focus-within:ring-primary-container/50 transition-all hover:bg-white/80 shadow-sm">
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-on-surface-variant/40 p-0" placeholder="输入你的消息..." type="text">
<div class="flex items-center gap-1">
<button class="p-2 rounded-xl hover:bg-primary/10 text-on-surface-variant/60 hover:text-primary transition-colors flex items-center justify-center">
<span aria-hidden="true" class="font-label-sm text-label-sm font-bold">语音</span>
</button>
<button class="bg-gradient-to-r from-primary to-secondary text-on-primary p-3 rounded-xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center">
<span aria-hidden="true" class="font-label-sm text-label-sm font-bold">发送</span>
</button>
</div>
</div>
</div>
<!-- Quick Action Button (Primary Onboarding Step) -->
<button class="w-full py-4 bg-primary/10 border border-primary/20 text-primary font-label-lg rounded-2xl hover:bg-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>开启奇妙旅程</span>
<span aria-hidden="true" class="group-hover:translate-x-1 transition-transform">→</span>
</button>
</div>
<!-- Subtle Help Text -->
<p class="mt-6 text-label-sm text-on-surface-variant/60 text-center lg:text-left w-full">
                你的信息将仅用于个性化定制你的数字形象。
            </p>
</div>
</div>
<!-- Matching Intent Options (Bottom) -->
<div class="w-full max-w-2xl flex flex-col items-center gap-4 pb-4">
<p class="font-label-sm text-label-sm text-on-surface-variant/70 uppercase tracking-widest">选择你的主要探索目标</p>
<div class="flex flex-wrap justify-center gap-3">
<button class="px-6 py-3 rounded-full bg-white/40 backdrop-blur-md border border-white/40 shadow-sm hover:bg-white/70 hover:-translate-y-1 transition-all flex items-center gap-2 group glass-edge">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform">school</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface">学习伙伴</span>
</button>
<button class="px-6 py-3 rounded-full bg-white/40 backdrop-blur-md border border-white/40 shadow-sm hover:bg-white/70 hover:-translate-y-1 transition-all flex items-center gap-2 group glass-edge">
<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">groups</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface">社交达人</span>
</button>
<button class="px-6 py-3 rounded-full bg-white/40 backdrop-blur-md border border-white/40 shadow-sm hover:bg-white/70 hover:-translate-y-1 transition-all flex items-center gap-2 group glass-edge">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">favorite</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface">寻找灵感</span>
</button>
</div>
</div>
</main>
</body></html>
