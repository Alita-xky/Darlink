# Apply into /etc/nginx/sites-enabled/darlink

location = / {
    return 302 /landing-v14.html;
}

location = /app.html {
    alias /home/xuhaiyu/Darlink/frontend/app.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /prototype-engine.js {
    alias /home/xuhaiyu/Darlink/frontend/prototype-engine.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /flow-router.js {
    alias /home/xuhaiyu/Darlink/frontend/flow-router.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /questionnaire-data.js {
    alias /home/xuhaiyu/Darlink/frontend/questionnaire-data.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location / {
    return 302 /app.html;
}
